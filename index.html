<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zen Timer</title>
  <style>
    :root {
      --bg1: #f5efe6;
      --bg2: #e9dfd1;
      --card: rgba(255, 255, 255, 0.82);
      --text: #4e4338;
      --muted: #7e7062;
      --line: #ddd1c2;
      --accent: #8e745e;
      --accent-dark: #735d4b;
      --stop: #b56a64;
      --shadow: 0 12px 40px rgba(88, 66, 46, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.75), transparent 35%),
        linear-gradient(160deg, var(--bg1), var(--bg2));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.55);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 28px;
    }

    .title {
      text-align: center;
      margin-bottom: 6px;
      font-size: 1.9rem;
      font-weight: 650;
      letter-spacing: 0.02em;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 26px;
    }

    .clock {
      text-align: center;
      font-size: 3rem;
      font-weight: 300;
      letter-spacing: 0.05em;
      font-variant-numeric: tabular-nums;
      margin-bottom: 8px;
    }

    .status {
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 18px;
      min-height: 1.4em;
    }

    .progress-wrap {
      width: 100%;
      height: 10px;
      background: rgba(142,116,94,0.12);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #b89d83);
      border-radius: 999px;
      transition: width 0.2s linear;
    }

    .section {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      background: rgba(255,255,255,0.45);
    }

    .section h3 {
      margin: 0 0 14px 0;
      font-size: 1rem;
      font-weight: 650;
      color: var(--accent-dark);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
    }

    .field {
      margin-bottom: 12px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 500;
    }

    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 12px;
      font-size: 0.98rem;
      background: rgba(255,255,255,0.92);
      color: var(--text);
      outline: none;
    }

    input:focus {
      border-color: #b39a84;
      box-shadow: 0 0 0 3px rgba(179,154,132,0.16);
    }

    .help {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.35;
    }

    .button-row {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }

    button {
      flex: 1;
      border: none;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 1rem;
      font-weight: 650;
      cursor: pointer;
      transition: transform 0.08s ease, opacity 0.2s ease, background 0.2s ease;
    }

    button:hover {
      opacity: 0.96;
    }

    button:active {
      transform: translateY(1px);
    }

    .btn-start {
      background: var(--accent);
      color: white;
    }

    .btn-start:hover {
      background: var(--accent-dark);
    }

    .btn-stop {
      background: var(--stop);
      color: white;
    }

    .btn-secondary {
      background: rgba(142,116,94,0.12);
      color: var(--accent-dark);
    }

    .footer-note {
      margin-top: 18px;
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.4;
    }

    @media (max-width: 560px) {
      .grid,
      .grid-3 {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 20px;
      }

      .clock {
        font-size: 2.45rem;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">Zen Timer</div>
    <div class="subtitle">Meditation timer with start/end, stage, and reminder tones</div>

    <div class="clock" id="clock">00:00</div>
    <div class="status" id="status">Ready to begin</div>
    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="section">
      <h3>Session</h3>
      <div class="grid">
        <div class="field">
          <label for="duration">Total duration (minutes)</label>
          <input type="number" id="duration" value="30" min="1" step="1">
        </div>
        <div class="field">
          <label for="reminderEvery">Reminder every (minutes)</label>
          <input type="number" id="reminderEvery" value="5" min="0" step="1">
        </div>
        <div class="field">
          <label for="stageEvery">Stage every (minutes)</label>
          <input type="number" id="stageEvery" value="10" min="0" step="1">
        </div>
      </div>
      <div class="help">
        Set reminder or stage to 0 if you do not want that tone.
      </div>
    </div>

    <div class="section">
      <h3>Start / End Tone</h3>
      <div class="grid">
        <div class="field">
          <label for="startFreq">Frequency (Hz)</label>
          <input type="number" id="startFreq" value="146.8" min="50" step="0.1">
        </div>
        <div class="field">
          <label for="startDur">Duration (seconds)</label>
          <input type="number" id="startDur" value="5.5" min="0.2" step="0.1">
        </div>
      </div>
    </div>

    <div class="section">
      <h3>Stage Tone</h3>
      <div class="grid">
        <div class="field">
          <label for="stageFreq">Frequency (Hz)</label>
          <input type="number" id="stageFreq" value="220" min="50" step="0.1">
        </div>
        <div class="field">
          <label for="stageDurTone">Duration (seconds)</label>
          <input type="number" id="stageDurTone" value="3.5" min="0.2" step="0.1">
        </div>
      </div>
    </div>

    <div class="section">
      <h3>Reminder Tone</h3>
      <div class="grid">
        <div class="field">
          <label for="reminderFreq">Frequency (Hz)</label>
          <input type="number" id="reminderFreq" value="329.6" min="50" step="0.1">
        </div>
        <div class="field">
          <label for="reminderDur">Duration (seconds)</label>
          <input type="number" id="reminderDur" value="2.2" min="0.2" step="0.1">
        </div>
      </div>
    </div>

    <div class="button-row">
      <button id="mainButton" class="btn-start">Start</button>
      <button id="testButton" class="btn-secondary">Test tones</button>
    </div>

    <div class="footer-note">
      Tip: lower frequencies feel deeper, but phone speakers may reproduce them less strongly.
    </div>
  </div>

  <script>
    let audioCtx = null;
    let active = false;
    let sessionStart = null;
    let timerId = null;
    let wakeLock = null;

    let nextReminder = Infinity;
    let nextStage = Infinity;
    let totalDurationSec = 0;

    const STORAGE_KEY = "zenTimerSettingsV1";

    function $(id) {
      return document.getElementById(id);
    }

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function formatTime(seconds) {
      seconds = Math.max(0, Math.floor(seconds));
      const min = Math.floor(seconds / 60);
      const sec = seconds % 60;
      return `${String(min).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
    }

    function getSettings() {
      return {
        duration: parseFloat($("duration").value),
        reminderEvery: parseFloat($("reminderEvery").value),
        stageEvery: parseFloat($("stageEvery").value),

        startFreq: parseFloat($("startFreq").value),
        startDur: parseFloat($("startDur").value),

        stageFreq: parseFloat($("stageFreq").value),
        stageDurTone: parseFloat($("stageDurTone").value),

        reminderFreq: parseFloat($("reminderFreq").value),
        reminderDur: parseFloat($("reminderDur").value)
      };
    }

    function validateSettings(s) {
      if (isNaN(s.duration) || s.duration <= 0) {
        alert("Please enter a valid total duration.");
        return false;
      }

      const numericFields = [
        s.startFreq, s.startDur,
        s.stageFreq, s.stageDurTone,
        s.reminderFreq, s.reminderDur
      ];

      if (numericFields.some(v => isNaN(v) || v <= 0)) {
        alert("Please enter valid frequencies and durations for all tones.");
        return false;
      }

      if (!isNaN(s.reminderEvery) && s.reminderEvery < 0) {
        alert("Reminder interval cannot be negative.");
        return false;
      }

      if (!isNaN(s.stageEvery) && s.stageEvery < 0) {
        alert("Stage interval cannot be negative.");
        return false;
      }

      return true;
    }

    function saveSettings() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(getSettings()));
    }

    function loadSettings() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;

      try {
        const s = JSON.parse(raw);
        for (const [key, value] of Object.entries(s)) {
          if ($(key) && value !== undefined && value !== null) {
            $(key).value = value;
          }
        }
      } catch (e) {
        console.warn("Could not load saved settings", e);
      }
    }

    function updateProgress(elapsedSec) {
      const pct = totalDurationSec > 0
        ? Math.min(100, (elapsedSec / totalDurationSec) * 100)
        : 0;
      $("progressBar").style.width = pct + "%";
    }

    function updateClock(elapsedSec) {
      $("clock").textContent = formatTime(elapsedSec);
    }

    async function requestWakeLock() {
      try {
        if ("wakeLock" in navigator) {
          wakeLock = await navigator.wakeLock.request("screen");
        }
      } catch (err) {
        console.log("Wake Lock unavailable:", err);
      }
    }

    async function releaseWakeLock() {
      if (wakeLock) {
        try {
          await wakeLock.release();
        } catch (e) {}
        wakeLock = null;
      }
    }

    function playBowl(frequency, duration, baseVolume = 0.18) {
      const ctx = getAudioContext();
      const now = ctx.currentTime;

      const partials = [
        { ratio: 1.00, amp: 1.00 },
        { ratio: 2.01, amp: 0.42 },
        { ratio: 2.73, amp: 0.22 },
        { ratio: 4.08, amp: 0.10 }
      ];

      partials.forEach((p, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(frequency * p.ratio, now);
        osc.detune.setValueAtTime(i % 2 === 0 ? -2 : 2, now);

        gain.gain.setValueAtTime(baseVolume * p.amp, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + duration);
      });
    }

    function playTone(type) {
      const s = getSettings();

      if (type === "startEnd") {
        playBowl(s.startFreq, s.startDur, 0.22);
      } else if (type === "stage") {
        playBowl(s.stageFreq, s.stageDurTone, 0.17);
      } else if (type === "reminder") {
        playBowl(s.reminderFreq, s.reminderDur, 0.13);
      }
    }

    function startSession() {
      const s = getSettings();
      if (!validateSettings(s)) return;

      saveSettings();

      totalDurationSec = s.duration * 60;
      const reminderIntervalSec = s.reminderEvery > 0 ? s.reminderEvery * 60 : Infinity;
      const stageIntervalSec = s.stageEvery > 0 ? s.stageEvery * 60 : Infinity;

      nextReminder = reminderIntervalSec;
      nextStage = stageIntervalSec;

      active = true;
      sessionStart = performance.now();

      $("status").textContent = "Session in progress";
      $("mainButton").textContent = "Stop";
      $("mainButton").className = "btn-stop";

      updateClock(0);
      updateProgress(0);

      getAudioContext();
      playTone("startEnd");
      requestWakeLock();

      timerId = setInterval(() => {
        const elapsedSec = (performance.now() - sessionStart) / 1000;

        updateClock(elapsedSec);
        updateProgress(elapsedSec);

        if (elapsedSec >= totalDurationSec) {
          finishSession();
          return;
        }

        if (elapsedSec >= nextStage) {
          playTone("stage");
          nextStage += stageIntervalSec;

          if (Math.abs(nextReminder - elapsedSec) < 1) {
            nextReminder += reminderIntervalSec;
          }
        } else if (elapsedSec >= nextReminder) {
          playTone("reminder");
          nextReminder += reminderIntervalSec;
        }
      }, 250);
    }

    function finishSession() {
      clearInterval(timerId);
      active = false;

      playTone("startEnd");

      $("clock").textContent = formatTime(totalDurationSec);
      $("status").textContent = "Session completed";
      $("progressBar").style.width = "100%";

      $("mainButton").textContent = "Start";
      $("mainButton").className = "btn-start";

      releaseWakeLock();
    }

    function stopSession() {
      clearInterval(timerId);
      active = false;

      $("status").textContent = "Session stopped";
      $("mainButton").textContent = "Start";
      $("mainButton").className = "btn-start";

      releaseWakeLock();
    }

    function testTones() {
      const s = getSettings();
      if (!validateSettings(s)) return;

      getAudioContext();
      $("status").textContent = "Testing tones...";

      playTone("startEnd");

      setTimeout(() => {
        playTone("stage");
      }, 1200);

      setTimeout(() => {
        playTone("reminder");
        $("status").textContent = "Ready to begin";
      }, 2400);
    }

    $("mainButton").addEventListener("click", () => {
      if (active) {
        stopSession();
      } else {
        startSession();
      }
    });

    $("testButton").addEventListener("click", () => {
      testTones();
    });

    document.addEventListener("visibilitychange", async () => {
      if (active && document.visibilityState === "visible") {
        await requestWakeLock();
      }
    });

    document.querySelectorAll("input").forEach(input => {
      input.addEventListener("change", saveSettings);
    });

    loadSettings();
  </script>
</body>
</html>
